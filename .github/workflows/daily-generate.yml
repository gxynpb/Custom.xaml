name: 每日生成 PCL 主页

on:
  schedule:
    # 北京时间 8/10/12/14/16/18/20/22 点各运行一次（UTC 0/2/4/6/8/10/12/14）
    # 凌晨 23:00-8:00 不运行
    - cron: '0 0,2,4,6,8,10,12,14 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 生成 XAML
        run: |
          cd pcl-home
          python generate.py

      - name: 提交并推送
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Custom.xaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 更新主页内容 [自动]" && git push)
